name: CI

on:
  # Every pushed branch must be gated, not only main, so a future working
  # branch cannot accumulate untested commits.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs of the same ref. In-progress gates are never cancelled: a
# conformance run must either finish or fail on its own evidence.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-conformance:
    name: Official pikaid conformance suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PIKAID_SPECS_REPOSITORY: https://github.com/pikaid/pikaid-specs.git
      PIKAID_SPECS_COMMIT: 059780cc0e5b113443812720d95c630649bf3aa3
      PIKAID_SPECS_ROOT: ${{ github.workspace }}/.ai/official-suite/pikaid-specs
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Fetch the pinned official suite commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PIKAID_SPECS_ROOT"
          git -C "$PIKAID_SPECS_ROOT" init --quiet
          git -C "$PIKAID_SPECS_ROOT" remote add origin "$PIKAID_SPECS_REPOSITORY"
          if ! git -C "$PIKAID_SPECS_ROOT" fetch --quiet --depth 1 origin "$PIKAID_SPECS_COMMIT"; then
            git -C "$PIKAID_SPECS_ROOT" fetch --quiet origin
          fi
          git -C "$PIKAID_SPECS_ROOT" checkout --quiet --detach "$PIKAID_SPECS_COMMIT"
          actual="$(git -C "$PIKAID_SPECS_ROOT" rev-parse HEAD)"
          if [ "$actual" != "$PIKAID_SPECS_COMMIT" ]; then
            echo "::error::official suite commit mismatch: expected $PIKAID_SPECS_COMMIT, got $actual"
            exit 1
          fi
          echo "Verified official suite commit $actual"

      - name: Install suite verification dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement "$PIKAID_SPECS_ROOT/conformance/tools/requirements.txt"

      - name: Verify official fixture package and reference oracles
        shell: bash
        working-directory: ${{ github.workspace }}/.ai/official-suite/pikaid-specs/conformance
        run: |
          set -euo pipefail
          python tools/verify_vectors.py --expect-status OFFICIAL \
            --expect-package-revision 1.0.0 --expect-spec-revision 1.0.4
          python -m unittest discover -s tools/tests -v
          node tools/verify_oracle_node.mjs

      - name: Compile implementation and test-only conformance adapter
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress test-compile

      - name: Run the official conformance suite against the Java adapter
        shell: bash
        working-directory: ${{ github.workspace }}/.ai/official-suite/pikaid-specs/conformance
        run: |
          set -euo pipefail
          python tools/run_adapter.py --automated-only \
            --report-json "$GITHUB_WORKSPACE/.ai/official-conformance-report.json" \
            -- java \
              -cp "$GITHUB_WORKSPACE/target/classes:$GITHUB_WORKSPACE/target/test-classes" \
              dev.pikaid.conformance.ConformanceAdapter

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-conformance-report
          path: .ai/official-conformance-report.json
          if-no-files-found: ignore

  verify:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
          - os: ubuntu-latest
            java: '21'
          - os: macos-latest
            java: '21'
          - os: windows-latest
            java: '21'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify release artifact hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -qx '/.ai/' .gitignore
          # Verify the explicit root directory rule against a nested path even
          # when checkout contains no local .ai directory.
          git check-ignore -q --no-index .ai/reports/probe.md
          if git check-ignore -q .github/workflows/ci.yml; then
            echo "::error::.gitignore must not hide repository configuration files"
            exit 1
          fi
          tracked_workspace="$(git ls-files -- .ai)"
          if [ -n "$tracked_workspace" ]; then
            echo "::error::.ai must never be tracked:"
            printf '%s\n' "$tracked_workspace"
            exit 1
          fi
          for artifact in target/*.jar; do
            entries="$(jar tf "$artifact")"
            if printf '%s\n' "$entries" | grep -Eq '(^|/)\.ai(/|$)'; then
              echo "::error::$artifact contains local .ai workspace files"
              printf '%s\n' "$entries" | grep -E '(^|/)\.ai(/|$)'
              exit 1
            fi
          done
          archive_entries="$(git archive --format=tar HEAD | tar -tf -)"
          if printf '%s\n' "$archive_entries" | grep -Eq '(^|/)\.ai(/|$)'; then
            echo "::error::source archive would contain local .ai workspace files"
            exit 1
          fi
          echo "Artifact hygiene checks passed."

      - name: Verify package contents and metadata
        shell: bash
        run: |
          set -euo pipefail
          repo="$PWD"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          main_jar="target/pikaid-1.0.0.jar"
          sources_jar="target/pikaid-1.0.0-sources.jar"
          javadoc_jar="target/pikaid-1.0.0-javadoc.jar"
          for artifact in "$main_jar" "$sources_jar" "$javadoc_jar" LICENSE; do
            if [ ! -s "$artifact" ]; then
              echo "::error::missing or empty: $artifact"
              exit 1
            fi
          done
          for entry in \
            'dev/pikaid/Pikaid.class' \
            "dev/pikaid/Pikaid\$DefaultGeneratorHolder.class" \
            'dev/pikaid/PikaidFormatException.class' \
            'dev/pikaid/PikaidGenerator.class' \
            'dev/pikaid/package-info.class' \
            'META-INF/maven/dev.pikaid/pikaid/pom.xml' \
            'META-INF/maven/dev.pikaid/pikaid/pom.properties'; do
            jar tf "$main_jar" | grep -Fqx "$entry" || {
              echo "::error::$main_jar is missing $entry"
              exit 1
            }
          done
          for entry in \
            'dev/pikaid/Pikaid.java' \
            'dev/pikaid/PikaidFormatException.java' \
            'dev/pikaid/PikaidGenerator.java' \
            'dev/pikaid/package-info.java'; do
            jar tf "$sources_jar" | grep -Fqx "$entry" || {
              echo "::error::$sources_jar is missing $entry"
              exit 1
            }
          done
          jar tf "$javadoc_jar" | grep -Fqx 'dev.pikaid/dev/pikaid/Pikaid.html' || {
            echo "::error::$javadoc_jar is missing the Pikaid API documentation"
            exit 1
          }

          for artifact in "$main_jar" "$sources_jar"; do
            jar tf "$artifact" | grep -Fqx 'META-INF/LICENSE' || {
              echo "::error::$artifact is missing the MIT LICENSE notice"
              exit 1
            }
            license_dir="$work/license-$(basename "$artifact" .jar)"
            mkdir -p "$license_dir"
            (cd "$license_dir" && jar xf "$repo/$artifact" META-INF/LICENSE)
            grep -Fq 'MIT License' "$license_dir/META-INF/LICENSE" || {
              echo "::error::$artifact META-INF/LICENSE is not the MIT license text"
              exit 1
            }
          done

          mkdir -p "$work/main"
          (cd "$work/main" && jar xf "$repo/$main_jar" \
            META-INF/MANIFEST.MF \
            META-INF/maven/dev.pikaid/pikaid/pom.xml \
            META-INF/maven/dev.pikaid/pikaid/pom.properties)
          tr -d '\r' < "$work/main/META-INF/MANIFEST.MF" > "$work/manifest.txt"
          grep -Fqx 'Automatic-Module-Name: dev.pikaid' "$work/manifest.txt"
          for property in 'groupId=dev.pikaid' 'artifactId=pikaid' 'version=1.0.0'; do
            tr -d '\r' < "$work/main/META-INF/maven/dev.pikaid/pikaid/pom.properties" \
              | grep -Fqx "$property"
          done
          for marker in \
            '<name>pikaid</name>' \
            '<description>Official Java implementation of pikaid' \
            '<licenses>' \
            '<developers>' \
            '<scm>' \
            '<url>https://github.com/pikaid/pikaid-java</url>'; do
            grep -Fq "$marker" "$work/main/META-INF/maven/dev.pikaid/pikaid/pom.xml" || {
              echo "::error::embedded POM is missing $marker"
              exit 1
            }
          done

          mkdir -p "$work/all"
          for artifact in "$main_jar" "$sources_jar" "$javadoc_jar"; do
            (cd "$work/all" && jar xf "$repo/$artifact")
          done
          if grep -RIl -E '/Users/|/home/|opencode\.jsonc|Tohru Drive|BEGIN .*PRIVATE KEY' "$work/all" > "$work/leaks.txt"; then
            echo "::error::packaged files contain local or sensitive content"
            cat "$work/leaks.txt"
            exit 1
          fi
          echo "Package inventory and metadata checks passed."

      - name: Install artifact for consumer smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests

      - name: Consumer smoke test against installed artifact
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          mkdir -p "$consumer/src/main/java/consumer"
          cat > "$consumer/pom.xml" <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>consumer</groupId>
            <artifactId>pikaid-consumer</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>17</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <dependencies>
              <dependency>
                <groupId>dev.pikaid</groupId>
                <artifactId>pikaid</artifactId>
                <version>1.0.0</version>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.codehaus.mojo</groupId>
                  <artifactId>exec-maven-plugin</artifactId>
                  <version>3.5.0</version>
                </plugin>
              </plugins>
            </build>
          </project>
          POM
          cat > "$consumer/src/main/java/consumer/ConsumerMain.java" <<'JAVA'
          package consumer;

          import dev.pikaid.Pikaid;
          import java.util.HexFormat;

          public final class ConsumerMain {
              private ConsumerMain() {
              }

              public static void main(String[] args) {
                  HexFormat hex = HexFormat.of();
                  Pikaid id = Pikaid.of(1_700_000_000L, hex.parseHex("00112233445566778899aabb"));
                  require("0s44we8002loz3po6mcf6vsn23".equals(id.toString()), "canonical text");
                  require(Pikaid.parse(id.toString()).equals(id), "text round trip");
                  require(Pikaid.fromBinary(id.toBinary()).equals(id), "binary round trip");
                  require(id.toBinary().length == Pikaid.BINARY_LENGTH, "binary length");
                  require("006553f10000112233445566778899aabb".equals(hex.formatHex(id.toBinary())),
                          "binary layout");
                  require("00112233445566778899aabb".equals(id.randomnessHex()), "randomness hex");
                  require(id.timestamp() == 1_700_000_000L, "timestamp");
                  require(Pikaid.isValid(id.toString()), "full validity");
                  require(Pikaid.isWellFormed(id.toString()), "shape validity");
                  require(Pikaid.generate().toString().length() == Pikaid.STRING_LENGTH, "generation");
                  System.out.println("CONSUMER_OK " + id);
              }

              private static void require(boolean condition, String message) {
                  if (!condition) {
                      throw new AssertionError(message);
                  }
              }
          }
          JAVA
          "$GITHUB_WORKSPACE/mvnw" --batch-mode --no-transfer-progress \
            -f "$consumer/pom.xml" compile exec:java \
            -Dexec.mainClass=consumer.ConsumerMain
