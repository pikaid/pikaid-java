name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate Maven release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify version in pom.xml matches stable tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected stable tag such as v1.0.1"
            exit 1
          }
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          pom = ET.parse("pom.xml")
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = pom.findtext("m:version", namespaces=namespace)
          expected = os.environ["GITHUB_REF_NAME"][1:]
          if version != expected:
              raise SystemExit(f"pom.xml version {version} does not match tag {expected}")
          print(f"Validated Maven release {expected}")
          PY

      - name: Run complete Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress verify

  publish:
    name: Sign and publish through Central Portal
    needs: verify
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Check out verified release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Ensure release credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"
          test -n "$GPG_PASSPHRASE"

      - name: Set up Java, Maven Central credentials and signing key
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: GPG_PASSPHRASE

      - name: Publish validated, signed release automatically
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease deploy
